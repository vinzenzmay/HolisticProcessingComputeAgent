[project]
name = "hpca"
version = "0.8.0"
description = "HolisticProcessingComputeAgent - terminal AI agent for HPC Slurm clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
]

[project.scripts]
hpca = "hpca.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live-backend tests are opt-in: `pytest -m integration` (needs a reachable
# LLM, e.g. the cluster tunnel on localhost:20001). Everything else is the
# fast, hermetic unit suite.
addopts = "-m 'not integration'"
markers = [
    "integration: live-LLM backend test (runs real generations; opt in with -m integration)",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hpca = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.feature.dev.tasks]
# Fast hermetic suite, parallel across CPUs (the default day-to-day run).
test = "pytest -n auto"
# Serial run, for debugging (readable output, -x/--pdb work as usual).
test-serial = "pytest"
# Live-backend integration tests: needs a reachable LLM (cluster tunnel).
test-live = "pytest -m integration"
