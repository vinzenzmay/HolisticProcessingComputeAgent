# Built-in error signature library (§5.5). User-extensible: entries in
# ~/.HolisticProcessingComputeAgent/error_signatures.yaml are merged on top and
# an entry with an existing id replaces the built-in one.
#
# Fields: id, title, patterns (list of case-insensitive regexes matched per
# line), hint (deterministic suggestion shown alongside the excerpt).

- id: oom_kill
  title: Out of memory (OOM kill)
  patterns:
    - "oom[-_ ]?kill"
    - "out of memory"
    - "MemoryError"
    - "Cannot allocate memory"
    - "std::bad_alloc"
  hint: >-
    The job exceeded its memory allocation. Increase the request
    (e.g. sbatch --mem=...) or reduce the working set / thread count.

- id: time_limit
  title: Walltime limit reached
  patterns:
    - "DUE TO TIME LIMIT"
  hint: >-
    The job hit its time limit. Increase --time, checkpoint/restart, or
    split the work into smaller jobs.

- id: command_not_found
  title: Command not found
  patterns:
    - "command not found"
    - "No module named "
  hint: >-
    A required tool or module is missing from the environment. Check
    spelling, load the right environment module / conda env in the script.

- id: python_traceback
  title: Python exception
  patterns:
    - 'Traceback \(most recent call last\)'
  hint: >-
    The Python script raised an exception; the last excerpt line names the
    error type and message.

- id: r_error
  title: R error
  patterns:
    - "^Error in "
    - "^Error: "
    - "Execution halted"
  hint: The R script failed; see the Error line in the excerpt.

- id: snakemake_rule_failure
  title: Snakemake rule failure
  patterns:
    - "Error in rule "
    - "SnakemakeError"
    - "WorkflowError"
  hint: >-
    A workflow rule failed; check the rule's own log file listed near
    'Error in rule' for the underlying tool error.

- id: missing_input
  title: Missing file
  patterns:
    - "No such file or directory"
    - "MissingInputException"
    - "FileNotFoundError"
  hint: >-
    An input path does not exist (or a filesystem was unavailable). Verify
    the path and any preceding step that should have produced it.

- id: permission_denied
  title: Permission denied
  patterns:
    - "Permission denied"
    - "PermissionError"
  hint: >-
    Access was refused. Check file/directory ownership and group permissions
    (project directories often need the right group).

- id: quota_exceeded
  title: Disk quota exceeded
  patterns:
    - "quota exceeded"
    - "No space left on device"
  hint: >-
    The filesystem is full or the quota is exhausted. Clean up scratch
    space, or write outputs to a filesystem with room.

# --------------------------------------------------------------------------
# Local CLI tools (§5.4). The library above was written for cluster job logs;
# these cover how a tool invoked from a generated script actually fails.

- id: cli_usage_error
  title: Wrong command-line arguments
  patterns:
    - ": error: unrecognized arguments"
    - ": error: (the following )?arguments? "
    - ": error: invalid choice"
    - ": error: argument "
    - "unrecognized option"
    - "invalid option"
    - "illegal option"
  hint: >-
    The tool rejected its arguments — usually a flag that does not exist, or
    a value passed positionally where a flag was required. Read its --help
    for the exact spelling before rewriting the script.

- id: htslib_open_failure
  title: samtools/htslib could not open a file
  patterns:
    - "\\[E::hts_open"
    - "\\[E::.*fail"
    - "fail(ed)? to open"
    - "truncated file"
    - "invalid BGZF header"
  hint: >-
    htslib could not read an input. Check the path, that the file is not
    truncated, and that a .bai/.crai index exists next to it where one is
    required.

- id: missing_index
  title: Alignment index missing
  patterns:
    - "index file .* not found"
    - "fail(ed)? to load .*index"
    - "no (BAI|CSI|CRAI) index"
    - "random alignment retrieval only works for indexed"
  hint: >-
    The tool needs an index beside the alignment. Run `samtools index` on the
    BAM/CRAM first.

- id: reference_mismatch
  title: Reference does not match the alignment
  patterns:
    - "does not match .*reference"
    - "SQ lines? .* mismatch"
    - "reference .* not found in"
    - "chromosome .* not (found|present)"
  hint: >-
    The reference FASTA and the alignment disagree on contigs. Confirm both
    were built against the same assembly (and the same naming, chr20 vs 20).
